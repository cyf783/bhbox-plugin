plugins {
    id 'com.android.application'
}

android {
    namespace 'bh.box.plugin.qjsspider'
    compileSdk rootProject.ext.compileSdk

    defaultConfig {
        applicationId "bh.box.plugin.qjsspider"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk
        versionCode 121
        versionName "1.2.1"
        ndk { abiFilters "arm64-v8a" }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 插件 so 由 PluginManager 解压到磁盘后经 DexClassLoader 加载，APK 内压缩存储即可（官方 mmap 直读场景才需要未压缩对齐）
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    compileOnly 'com.github.cyf783:bhbox-catvod:1.0.0'
    // QuickJS wrapper（libquickjs-android-wrapper.so + Java 封装）
    implementation files('libs/quickjs_wrapper.aar')
    // JsSpider 引擎源码（com.github.tvbox.quickjs）直接放在本插件 src 下
    // jsoup / android-retrofuture 宿主无对应 keep 规则（已混淆改名），插件无法委托宿主，必须自带
    implementation 'org.jsoup:jsoup:' + jsoupVersion
    implementation 'net.sourceforge.streamsupport:android-retrofuture:1.7.4'
}

// 零依赖自写混淆字典任务（共享脚本，取代 cleverpumpkin proguard-dictionaries-generator 插件）
apply from: "$rootDir/gradle/proguard-dictionary.gradle"
