plugins {
    id 'com.android.application'
}

android {
    namespace 'bh.box.plugin.exo'
    compileSdk rootProject.ext.compileSdk

    defaultConfig {
        applicationId "bh.box.plugin.exo"
        minSdk 23
        targetSdk rootProject.ext.targetSdk
        versionCode 120
        versionName "1.2.0"
        ndk { abiFilters "arm64-v8a" }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 插件 so 由 PluginManager 解压到磁盘后经 DexClassLoader 加载，APK 内压缩存储即可（官方 mmap 直读场景才需要未压缩对齐）
    packaging {
        jniLibs {
            useLegacyPackaging = true
            excludes += ['**/libavfilter.so', '**/libavdevice.so']
        }
    }
}

dependencies {
    compileOnly 'com.github.cyf783:bhbox-catvod:1.0.0'
    implementation fileTree(dir: 'libs', include: ['*.aar'])
}


// 零依赖自写混淆字典任务（共享脚本，取代 cleverpumpkin proguard-dictionaries-generator 插件）
apply from: "$rootDir/gradle/proguard-dictionary.gradle"
