pluginManagement {
    repositories {
        maven { url 'https://mirrors.huaweicloud.com/repository/maven/' }
        maven { url 'https://mirrors.huaweicloud.com/repository/google/' }
        maven { url 'https://mirrors.huaweicloud.com/repository/gradle-plugin/' }
        gradlePluginPortal()
        mavenCentral()
        google()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // jitpack：bhbox-catvod 插件接口库
        maven { url 'https://jitpack.io' }
        // mavenLocal：本地调试 bhbox-catvod 时使用
        mavenLocal()
        maven { url "https://maven.aliyun.com/repository/releases" }
        maven { url 'https://mirrors.huaweicloud.com/repository/central/' }
        maven { url 'https://mirrors.huaweicloud.com/repository/maven/' }
        maven { url 'https://mirrors.huaweicloud.com/repository/google/' }
        google()
        mavenCentral()
    }
}

include ':app'
rootProject.name = "bhbox-plugin-legado"
