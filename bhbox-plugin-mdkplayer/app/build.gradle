plugins {
    id 'com.android.application'
}

android {
    namespace 'bh.box.plugin.mdk'
    compileSdk rootProject.ext.compileSdk

    defaultConfig {
        applicationId "bh.box.plugin.mdk"
        minSdk 23
        targetSdk rootProject.ext.targetSdk
        versionCode 100
        versionName "1.0.0"
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    // libc++_shared 由该 NDK 提供（mdk 预编 so 依赖其 ABI，向前兼容）
    ndkVersion '27.2.12479018'

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    // 插件 so 由 PluginManager 解压到磁盘后经 DexClassLoader 加载，APK 内压缩存储即可（官方 mmap 直读场景才需要未压缩对齐）
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // catvod 传递依赖的 kotlin-stdlib 2.2.x 元数据与 AGP 8.5 内嵌 Kotlin 2.0 不兼容，release lint 误报，插件发版不走 lint
    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    compileOnly 'com.github.cyf783:bhbox-catvod:1.0.0'
}

// 零依赖自写混淆字典任务（共享脚本，取代 cleverpumpkin proguard-dictionaries-generator 插件）
apply from: "$rootDir/gradle/proguard-dictionary.gradle"
