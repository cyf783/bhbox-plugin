plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'bh.box.plugin.pyspider'
    compileSdk rootProject.ext.compileSdk

    defaultConfig {
        applicationId "bh.box.plugin.pyspider"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk
        versionCode 110
        versionName "1.1.0"
        ndk { abiFilters "arm64-v8a" }

        python {
            version "3.8"
            pip {
                install "lxml"
                install "json5"
                install "ujson"
                install "jinja2"
                install "cssselect<1.3"
                install "pyquery<2"
                install "requests"
                install "jsonpath"
                install 'pycryptodome'
                install 'beautifulsoup4'
            }
        }
    }

    sourceSets {
        main {
            python.srcDirs = ["src/main/python"]
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 插件 so 由 PluginManager 解压到磁盘后经 DexClassLoader 加载，APK 内压缩存储即可（官方 mmap 直读场景才需要未压缩对齐）
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    compileOnly 'com.github.cyf783:bhbox-catvod:1.0.0'
}

// 零依赖自写混淆字典任务（共享脚本，与 Chaquopy 兼容，取代第三方字典插件）
apply from: "$rootDir/gradle/proguard-dictionary.gradle"
